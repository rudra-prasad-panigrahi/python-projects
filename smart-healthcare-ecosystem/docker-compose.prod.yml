services:

postgres:
extends:
file: docker-compose.yml
service: postgres
restart: always
ports: []
environment:
POSTGRES_DB: ${POSTGRES_DB}
POSTGRES_USER: ${POSTGRES_USER}
POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

redis:
extends:
file: docker-compose.yml
service: redis
restart: always
ports: []

backend:
build:
context: ./backend
dockerfile: Dockerfile
target: production
restart: always
env_file:
- .env
environment:
APP_ENV: production
DEBUG: "false"
DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}
REDIS_URL: redis://redis:6379/0
expose:
- "8000"
volumes:
- ./storage:/app/storage
depends_on:
postgres:
condition: service_healthy
redis:
condition: service_healthy
command:
[
"uvicorn",
"app.main:app",
"--host",
"0.0.0.0",
"--port",
"8000",
"--proxy-headers"
]

worker:
build:
context: ./backend
dockerfile: Dockerfile
target: production
restart: always
env_file:
- .env
environment:
APP_ENV: production
DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}
REDIS_URL: redis://redis:6379/0
volumes:
- ./storage:/app/storage
depends_on:
postgres:
condition: service_healthy
redis:
condition: service_healthy
command:
[
"celery",
"-A",
"app.workers.celery_app",
"worker",
"--loglevel=INFO"
]

frontend:
build:
context: ./frontend
dockerfile: Dockerfile
target: production
restart: always
environment:
NODE_ENV: production
VITE_API_BASE_URL: ${VITE_API_BASE_URL}
VITE_ENABLE_MSW: "false"
VITE_ENABLE_DEMO_MODE: "false"
expose:
- "80"
depends_on:
- backend

nginx:
image: nginx:1.27-alpine
container_name: smart-healthcare-nginx
restart: always
ports:
- "80:80"
- "443:443"
volumes:
- ./deployment/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
- ./deployment/nginx/certs:/etc/nginx/certs:ro
depends_on:
- frontend
- backend
