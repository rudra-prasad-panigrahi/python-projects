services:

postgres:
extends:
file: docker-compose.yml
service: postgres

redis:
extends:
file: docker-compose.yml
service: redis

backend:
build:
context: ./backend
dockerfile: Dockerfile
target: development
container_name: smart-healthcare-backend-dev
restart: unless-stopped
env_file:
- .env
environment:
APP_ENV: development
DEBUG: "true"
DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}
REDIS_URL: redis://redis:6379/0
ports:
- "8000:8000"
volumes:
- ./backend:/app
- ./storage:/app/storage
- ./ai:/app/ai
depends_on:
postgres:
condition: service_healthy
redis:
condition: service_healthy
command:
[
"uvicorn",
"app.main:app",
"--host",
"0.0.0.0",
"--port",
"8000",
"--reload"
]

worker:
build:
context: ./backend
dockerfile: Dockerfile
target: development
container_name: smart-healthcare-worker-dev
restart: unless-stopped
env_file:
- .env
environment:
APP_ENV: development
DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}
REDIS_URL: redis://redis:6379/0
volumes:
- ./backend:/app
- ./storage:/app/storage
- ./ai:/app/ai
depends_on:
postgres:
condition: service_healthy
redis:
condition: service_healthy
command:
[
"celery",
"-A",
"app.workers.celery_app",
"worker",
"--loglevel=INFO"
]

frontend:
build:
context: ./frontend
dockerfile: Dockerfile
target: development
container_name: smart-healthcare-frontend-dev
restart: unless-stopped
env_file:
- .env
environment:
VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
VITE_ENABLE_MSW: ${VITE_ENABLE_MSW:-true}
VITE_ENABLE_DEMO_MODE: ${VITE_ENABLE_DEMO_MODE:-true}
ports:
- "5173:5173"
volumes:
- ./frontend:/app
- /app/node_modules
depends_on:
- backend
command:
[
"npm",
"run",
"dev",
"--",
"--host",
"0.0.0.0"
]

volumes:
postgres_data:
redis_data:
