services:

postgres:
image: postgis/postgis:16-3.4
container_name: smart-healthcare-postgres
restart: unless-stopped
environment:
POSTGRES_DB: ${POSTGRES_DB:-smart_healthcare}
POSTGRES_USER: ${POSTGRES_USER:-healthcare_app}
POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-development-only}
ports:
- "${POSTGRES_PORT_HOST:-5432}:5432"
volumes:
- postgres_data:/var/lib/postgresql/data
healthcheck:
test:
[
"CMD-SHELL",
"pg_isready -U ${POSTGRES_USER:-healthcare_app} -d ${POSTGRES_DB:-smart_healthcare}"
]
interval: 10s
timeout: 5s
retries: 5
start_period: 10s

redis:
image: redis:7-alpine
container_name: smart-healthcare-redis
restart: unless-stopped
ports:
- "${REDIS_PORT_HOST:-6379}:6379"
volumes:
- redis_data:/data
command: redis-server --appendonly yes
healthcheck:
test: ["CMD", "redis-cli", "ping"]
interval: 10s
timeout: 5s
retries: 5

volumes:
postgres_data:
redis_data:
